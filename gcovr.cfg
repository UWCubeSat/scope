# Coverage of src/ by scope-test, from a build configured with -DCOVERAGE=ON.
# Run from the repository root after the tests: gcovr
root = .
filter = src/
exclude-throw-branches = yes
exclude-unreachable-branches = yes
exclude-noncode-lines = yes
html-details = build/coverage/index.html
html-title = SCOPE coverage
print-summary = yes
